<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Enchente na Vila – legenda completa na mesa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 28px 40px; background: #0E2433; color: #F3EBD8; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
<div style="display: flex; align-items: baseline; gap: 16px">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px; line-height: 1">Legenda</h1>
<span style="font-size: 20px; font-weight: 700; color: #C9D8E3">Como ler o mapa: o número no canto de cada quadra é a altura dela.</span>
</div>
<button type="button" style="height: 48px; padding: 0 24px; border-radius: 999px; border: 2px solid #8FA6BB; background: transparent; color: #F3EBD8; font-family: 'Nunito', system-ui, sans-serif; font-size: 18px; font-weight: 800; cursor: pointer">Fechar</button>
</div>
<div style="flex: 1; min-height: 0; column-count: 3; column-gap: 28px">
<sc-for list="{{items}}" as="c" hint-placeholder-count="15">
<sc-if value="{{c.isHeader}}" hint-placeholder-val="{{ false }}">
<div style="break-before: {{c.brk}}; break-inside: avoid; font-size: 16px; font-weight: 800; letter-spacing: 0.08em; color: #C9D8E3; padding: 0 0 8px">{{c.title}}</div>
</sc-if>
<sc-if value="{{c.isRow}}" hint-placeholder-val="{{ true }}">
<div style="break-inside: avoid; box-sizing: border-box; display: flex; align-items: center; gap: 14px; min-height: 64px; margin-bottom: 10px; padding: 8px 14px; border-radius: 14px; background: #16364A">
<span style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center">
<sc-if value="{{c.k_dry}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; gap: 3px"><span style="width: 12px; height: 38px; border-radius: 4px; background: #E9DDB5"></span><span style="width: 12px; height: 38px; border-radius: 4px; background: #D6BC83"></span><span style="width: 12px; height: 38px; border-radius: 4px; background: #BE9660"></span></span>
</sc-if>
<sc-if value="{{c.k_swatch}}" hint-placeholder-val="{{ false }}">
<span style="width: 40px; height: 40px; border-radius: 9px; background: {{c.swatchBg}}; box-shadow: inset 0 0 0 2px rgba(243, 235, 216, 0.5)"></span>
</sc-if>
<sc-if value="{{c.k_church}}" hint-placeholder-val="{{ false }}">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #F2B84B; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v6M9.5 4.5h5" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linecap="round"></path><path d="M6 21V12l6-4 6 4v9z" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linejoin="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.k_dock}}" hint-placeholder-val="{{ false }}">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #F2B84B; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15h18l-3 5H6z" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linejoin="round"></path><path d="M12 3v12M12 4l6 8h-6" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linejoin="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.k_injured}}" hint-placeholder-val="{{ false }}">
<span style="height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 13px; background: #FFFFFF; border: 2px solid #B3401F; color: #10263B; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 4px"><svg width="11" height="11" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1v8M1 5h8" fill="none" stroke="#B3401F" stroke-width="2.5" stroke-linecap="round"></path></svg>1</span>
</sc-if>
<sc-if value="{{c.k_ok}}" hint-placeholder-val="{{ false }}">
<span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #1F6F66; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.5" fill="none" stroke="#1F6F66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.k_lost}}" hint-placeholder-val="{{ false }}">
<span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #B3401F; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="#B3401F" stroke-width="2" stroke-linecap="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.k_pawn}}" hint-placeholder-val="{{ false }}">
<span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; background: #4FC3F7; border: 3px solid #F2B84B; box-shadow: 0 0 0 2px #F3EBD8; color: #10263B; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">L</span>
</sc-if>
<sc-if value="{{c.k_carry}}" hint-placeholder-val="{{ false }}">
<span style="height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 12px; background: #10263B; border: 1.5px solid #F3EBD8; color: #F3EBD8; font-size: 15px; font-weight: 800; display: flex; align-items: center">+1</span>
</sc-if>
<sc-if value="{{c.k_pin}}" hint-placeholder-val="{{ false }}">
<span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 7px; background: #4FC3F7; border: 2px solid #10263B; color: #10263B; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">L</span>
</sc-if>
<sc-if value="{{c.k_cost}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #F2B84B; color: #10263B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">2</span>
</sc-if>
</span>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 18px; font-weight: 800; line-height: 1.15">{{c.label}}</span>
<span style="font-size: 16px; font-weight: 600; line-height: 1.25; color: #C9D8E3">{{c.desc}}</span>
</div>
</div>
</sc-if>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const flooded = 'radial-gradient(circle at 50% 100%, transparent 5px, rgba(16,38,59,0.38) 5px 7px, transparent 7px) 0 0 / 14px 9px, #8FD0EC';
    const submerged = 'repeating-linear-gradient(45deg, rgba(255,255,255,0.20) 0 3px, transparent 3px 9px), radial-gradient(circle at 50% 100%, transparent 5px, rgba(255,255,255,0.6) 5px 7px, transparent 7px) 0 0 / 14px 9px, #2A6AA3';
    const KINDS = ['dry', 'swatch', 'church', 'dock', 'injured', 'ok', 'lost', 'pawn', 'carry', 'pin', 'cost'];
    const row = (kind, label, desc, extra) => {
      const o = { isHeader: false, isRow: true, label: label, desc: desc, swatchBg: 'transparent', brk: 'auto' };
      KINDS.forEach((k) => { o['k_' + k] = (k === kind); });
      return Object.assign(o, extra || {});
    };
    const head = (title, brk) => ({ isHeader: true, isRow: false, title: title, brk: brk || 'auto' });
    return {
      items: [
        head('QUADRAS'),
        row('dry', 'Seca', 'Anda normal, 1 ação'),
        row('swatch', 'Alagada', 'Andar custa 2 ações (Bombeiro: 1)', { swatchBg: flooded }),
        row('swatch', 'Submersa', 'Só a Barqueira passa', { swatchBg: submerged }),
        head('LUGARES', 'column'),
        row('church', 'Igreja', 'Abrigo dos moradores. Entregue = salvo'),
        row('dock', 'Cais', 'Saída da equipe. Todos aqui para vencer'),
        row('injured', 'Casa com morador ferido', 'O número é a quantidade de feridos'),
        row('ok', 'Casa vazia com ✓', 'Todos foram retirados da casa'),
        row('lost', 'Casa vazia com ✗', 'Algum morador ficou ilhado'),
        head('PESSOAS E AVISOS', 'column'),
        row('pawn', 'Voluntário', 'O anel dourado marca quem joga agora'),
        row('carry', '+1 em fundo preto', 'Voluntário carregando 1 morador'),
        row('pin', 'Quadrado com inicial', 'Sugestão (ping) de um jogador'),
        row('cost', 'Número dourado', 'Ações para andar até a quadra')
      ]
    };
  }
}
</script>
</body>
</html>
