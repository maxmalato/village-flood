<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Enchente na Vila – volta do jogador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px; background: #0E2433; color: #F3EBD8; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Enchente na Vila</span>
<div style="display: flex; align-items: center; gap: 8px"><span style="padding: 6px 12px; border-radius: 999px; background: #16364A; font-size: 14px; font-weight: 800; color: #F2B84B">Normal</span><button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #8FA6BB; background: transparent; color: #F3EBD8; font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Legenda</button></div>
</div>
<div style="box-sizing: border-box; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #81C784; color: #10263B">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; line-height: 1.15">Você voltou, Diego!</span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.3">Você volta a jogar no seu próximo turno, o 18. Até lá, acompanhe e opine.</span>
</div>
</div>
<div style="box-sizing: border-box; background: #16364A; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 800; letter-spacing: 0.08em; color: #C9D8E3">ENQUANTO VOCÊ ESTAVA FORA</span>
<sc-for list="{{events}}" as="e" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span style="flex: none; min-width: 34px; height: 22px; padding: 0 4px; box-sizing: border-box; border-radius: 11px; background: #0E2433; color: #F2B84B; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{e.turn}}</span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.3">{{e.text}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
<sc-for list="{{order}}" as="o" hint-placeholder-count="4">
<span style="display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #16364A; border: {{o.border}}; font-size: 14px; font-weight: 800">
<span style="width: 24px; height: 24px; border-radius: 50%; background: {{o.dot}}; color: #10263B; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px">{{o.initial}}</span>
{{o.label}}
</span>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: 18px repeat(6, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="49">
<sc-if value="{{c.isLabel}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: center; min-height: 18px; font-size: 14px; font-weight: 800; color: #C9D8E3">{{c.label}}</div>
</sc-if>
<sc-if value="{{c.isTile}}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="{{c.aria}}" style="position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: {{c.bg}}; box-shadow: inset 0 0 0 1px rgba(16, 38, 59, 0.35)">
<span style="position: absolute; top: 3px; left: 3px; min-width: 16px; height: 16px; border-radius: 5px; background: #F3EBD8; color: #10263B; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.h}}</span>
<sc-if value="{{c.hasHouseFull}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 12px; left: 13px; width: 26px; height: 26px; border-radius: 8px; background: #F3EBD8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linejoin="round"></path><path d="M10 20v-5h4v5" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linejoin="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.hasHouseEmpty}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 12px; left: 13px; width: 26px; height: 26px; border-radius: 8px; background: rgba(243, 235, 216, 0.75); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z" fill="none" stroke="#5B6B78" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="3 2"></path></svg></span>
</sc-if>
<sc-if value="{{c.isChurch}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 12px; left: 13px; width: 26px; height: 26px; border-radius: 8px; background: #F2B84B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v6M9.5 4.5h5" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linecap="round"></path><path d="M6 21V12l6-4 6 4v9z" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linejoin="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.isDock}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 12px; left: 13px; width: 26px; height: 26px; border-radius: 8px; background: #F2B84B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15h18l-3 5H6z" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linejoin="round"></path><path d="M12 3v12M12 4l6 8h-6" fill="none" stroke="#10263B" stroke-width="2.2" stroke-linejoin="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.markOk}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; bottom: 3px; right: 3px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #1F6F66; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.5" fill="none" stroke="#1F6F66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.markLost}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; bottom: 3px; right: 3px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #B3401F; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="#B3401F" stroke-width="2.2" stroke-linecap="round"></path></svg></span>
</sc-if>
<sc-if value="{{c.hasRes}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; bottom: 3px; right: 3px; height: 18px; padding: 0 4px; border-radius: 9px; background: #FFFFFF; border: 2px solid #B3401F; color: #10263B; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 2px"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1v8M1 5h8" fill="none" stroke="#B3401F" stroke-width="2.5" stroke-linecap="round"></path></svg>1</span>
</sc-if>
<sc-if value="{{c.hasPawn}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; bottom: 3px; left: 3px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; background: {{c.pawnBg}}; border: {{c.pawnRing}}; box-shadow: 0 0 0 1.5px #F3EBD8; color: #10263B; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px">{{c.pawnInitial}}</span>
</sc-if>
</div>
</sc-if>
</sc-for>
</div>
<div style="flex: 1"></div>
<button type="button" style="height: 52px; border: 0; border-radius: 16px; background: #F2B84B; color: #10263B; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; outline: 3px solid #F3EBD8; outline-offset: 3px; cursor: pointer">Acompanhar a partida</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const COLS = 'ABCDEF';
    const H = [[1,1,2,2,1,1],[1,2,2,3,2,1],[1,2,3,3,2,1],[1,2,3,2,2,1],[1,1,2,2,1,1],[1,1,1,1,1,1]];
    const houses = ['A2','A4','B1','B5','F3','E5','C2','C5','E2','E4'];
    const residents = { C2: 1, E4: 1, C5: 1 };
    const pawns = {
      C4: { i: 'B', bg: '#B39DDB' },
      A3: { i: 'L', bg: '#4FC3F7', active: true },
      D2: { i: 'C', bg: '#FF8A65' },
      C2: { i: 'D', bg: '#81C784' }
    };
    const dryBg = { 1: '#E9DDB5', 2: '#D6BC83', 3: '#BE9660' };
    const floodedBg = 'radial-gradient(circle at 50% 100%, transparent 4px, rgba(16,38,59,0.38) 4px 6px, transparent 6px) 0 0 / 12px 8px, #8FD0EC';
    const submergedBg = 'repeating-linear-gradient(45deg, rgba(255,255,255,0.20) 0 3px, transparent 3px 8px), radial-gradient(circle at 50% 100%, transparent 4px, rgba(255,255,255,0.6) 4px 6px, transparent 6px) 0 0 / 12px 8px, #2A6AA3';
    const names = { dry: 'seca', flooded: 'alagada', submerged: 'submersa' };
    const cells = [{ isLabel: true, isTile: false, label: '' }];
    for (let x = 0; x < 6; x++) cells.push({ isLabel: true, isTile: false, label: COLS[x] });
    for (let y = 0; y < 6; y++) {
      cells.push({ isLabel: true, isTile: false, label: String(y + 1) });
      for (let x = 0; x < 6; x++) {
        const id = COLS[x] + (y + 1);
        const h = H[y][x];
        const kind = id === 'D3' ? 'church' : id === 'B3' ? 'dock' : houses.indexOf(id) >= 0 ? 'house' : 'plain';
        const safe = kind === 'church' || kind === 'dock';
        const state = safe ? 'dry' : h === 1 ? 'submerged' : h === 2 ? 'flooded' : 'dry';
        const pawn = pawns[id];
        const res = residents[id];
        cells.push({
          isLabel: false, isTile: true, id: id, h: h,
          bg: state === 'dry' ? dryBg[h] : state === 'flooded' ? floodedBg : submergedBg,
          hasHouseFull: kind === 'house' && !!res,
          hasHouseEmpty: kind === 'house' && !res,
          markOk: kind === 'house' && !res && ['A2', 'B1', 'F3', 'E5', 'E2'].indexOf(id) >= 0,
          markLost: kind === 'house' && !res && ['A4', 'B5'].indexOf(id) >= 0,
          isChurch: kind === 'church', isDock: kind === 'dock',
          hasRes: !!res,
          hasPawn: !!pawn, pawnInitial: pawn ? pawn.i : '', pawnBg: pawn ? pawn.bg : 'transparent',
          pawnRing: pawn && pawn.active ? '3px solid #F2B84B' : '2px solid #10263B',
          aria: id + ', altura ' + h + ', ' + names[state] + (kind === 'house' ? ', casa' : kind === 'church' ? ', igreja' : kind === 'dock' ? ', cais' : '') + (res ? ', 1 morador ferido' : '') + (kind === 'house' && !res ? (['A4', 'B5'].indexOf(id) >= 0 ? ', casa vazia, algum morador ficou ilhado' : ', casa vazia, todos retirados') : '')
        });
      }
    }
    return {
      cells: cells,
      events: [
        { turn: 'T14', text: 'O bot jogou o seu turno: andou de C3 para C2.' },
        { turn: 'T14', text: 'Chuva (Garoa, +1): o rio foi de 16 para 17.' },
        { turn: 'T15', text: 'Agora é a vez da Lia.' }
      ],
      order: [
        { initial: 'L', dot: '#4FC3F7', label: 'Lia, agora', border: '2px solid #F2B84B' },
        { initial: 'C', dot: '#FF8A65', label: 'Carla', border: '2px solid transparent' },
        { initial: 'B', dot: '#B39DDB', label: 'Bruno', border: '2px solid transparent' },
        { initial: 'D', dot: '#81C784', label: 'Você, T18', border: '2px dashed #81C784' }
      ]
    };
  }
}
</script>
</body>
</html>
